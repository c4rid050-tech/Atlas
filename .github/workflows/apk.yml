name: APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair
        run: unzip -q "$(ls *.zip | head -1)" -d projeto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Compilar
        working-directory: projeto/atlas
        run: gradle assembleDebug --no-daemon
      - run: cp projeto/atlas/app/build/outputs/apk/debug/app-debug.apk Atlas.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: atlas-${{ github.run_number }}
          files: Atlas.apk
